[config]
type = "pipeline"
chartbook_format_version = "0.0.2"

[site]
title = "ChatGPT Price Forecasting"
author = "Tom&Sophie"
copyright = "2025"
logo_path = ""
favicon_path = ""

[pipeline]
id = "SL&TH"
pipeline_name = "ChatGPT Price Forecasting"
pipeline_description = "A project to replicate an analysis of ChatGPT-4 price forecasting"
lead_pipeline_developer = "Tom & Sophie"
contributors = ["Sophie Lara & Tom Hillenbrand"]
runs_on_grid_or_windows_or_other = "Windows/Linux/MacOS"
git_repo_URL = "github.com/thomashillenbrand/p05_lopez-lira_tang_2023"
README_file_path = "./README.md"

[notebooks]

[notebooks.p05_chatgpt_price_forecasting_guide_ipynb]
notebook_name = "ChatGPT Price Forecasting Notebook"
notebook_description = "Overview of the ChatGPT Price forecasting procedure and methodologies."
notebook_path = "_output/_notebook_build/p05_chatgpt_price_forecasting_guide_ipynb.ipynb"


[dataframes]

[dataframes.ravenpack]
dataframe_id = "ravenpack"
data_sources = ["WRDS"]
data_providers = ["RavenPack"]
dataframe_docs_str = "Dataframe showing Ravenpack data split out as intraday or overnight news"
how_is_pulled = "src/pull_ravenpack.py"
path_to_parquet_data = "_data/RAVENPACK.parquet"
date_col = "date_et"
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]


[dataframes.crsp_daily_stock]
dataframe_id = "crsp_daily_stock"
dataframe_docs_str = "This dataframe contains daily stock data from CRSP, including closing prices and other relevant fields."
data_sources = ["WRDS"]
data_providers = ["CRSP"]
how_is_pulled = "src/pull_CRSP_stock.py"
path_to_parquet_data = "_data/CRSP_stock_daily.parquet"
date_col = "dlycaldt"
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]


[dataframes.daily_headline_polarity]
dataframe_id = "daily_headline_polarity"
dataframe_docs_str = "Firm-day sentiment scores derived from OpenAI classifications of RavenPack headlines."
data_sources = ["RavenPack", "OpenAI"]
data_providers = ["RavenPack", "OpenAI"]
how_is_pulled = "src/create_firmday_score.py"
path_to_parquet_data = "_data/daily_headline_polarity.parquet"
date_col = "date"
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]


[dataframes.portfolio_returns]
dataframe_id = "portfolio_returns"
dataframe_docs_str = "Daily returns of headline-based trading portfolios constructed from RavenPack sentiment signals."
data_sources = ["CRSP", "RavenPack", "OpenAI"]
data_providers = ["WRDS", "OpenAI"]
how_is_pulled = "src/create_portfolios.py"
path_to_parquet_data = "_data/portfolio_daily_returns.parquet"
date_col = "date"
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]


[dataframes.table1_paper_sample]
dataframe_id = "table1_paper_sample"
dataframe_docs_str = "Replication of Table 1 using the paper sample period from 2021-10-01 to 2024-05-31."
data_sources = ["CRSP", "RavenPack", "OpenAI"]
data_providers = ["WRDS", "OpenAI"]
how_is_pulled = "src/create_table1.py"
path_to_parquet_data = "_output/table1_overnight_paper_sample.csv"
date_col = "date"
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]


[dataframes.table1_full_sample]
dataframe_id = "table1_full_sample"
dataframe_docs_str = "Replication of Table 1 using the full available sample."
data_sources = ["CRSP", "RavenPack", "OpenAI"]
data_providers = ["WRDS", "OpenAI"]
how_is_pulled = "src/create_table1.py"
path_to_parquet_data = "_output/table1_overnight_full_sample.csv"
date_col = "date"
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]


[dataframes.openai_label_proportions]
dataframe_id = "openai_label_proportions"
dataframe_docs_str = "Distribution of OpenAI headline labels across the paper sample and the full sample."
data_sources = ["RavenPack", "OpenAI"]
data_providers = ["RavenPack", "OpenAI"]
how_is_pulled = "src/create_openai_responses_table.py"
path_to_parquet_data = "_output/openai_output_label_proportions.csv"
date_col = "date"
links_to_data_providers = ["https://wrds-www.wharton.upenn.edu/"]


[charts]

[charts.ravenpack_news_timing]
dataframe_id = "ravenpack"
chart_name = "Overnight vs Intraday RavenPack News"
chart_docs_str = "Overnight vs Intraday RavenPack News"
short_description_chart = "Daily proportion of RavenPack headlines posted outside vs inside market hours (ET), with average lines."
path_to_html_chart = "_output/ravenpack_overnight_intraday_proportion.html"

[charts.figure5_paper_sample]
dataframe_id = "portfolio_returns"
chart_name = "Figure 5: Portfolio Performance (Paper Sample)"
chart_docs_str = "Replication of Figure 5 over the paper sample period."
short_description_chart = "Cumulative portfolio value for the long-short strategy and benchmark variants over the paper sample."
path_to_html_chart = "_output/figure5_paper_sample.html"

[charts.figure5_full_sample]
dataframe_id = "portfolio_returns"
chart_name = "Figure 5: Portfolio Performance (Full Sample)"
chart_docs_str = "Replication of Figure 5 over the full available sample."
short_description_chart = "Cumulative portfolio value for the long-short strategy and benchmark variants over the full sample."
path_to_html_chart = "_output/figure5_full_sample.html"

[charts.portfolio_size_diagnostics]
dataframe_id = "portfolio_returns"
chart_name = "Portfolio Size Diagnostics"
chart_docs_str = "Daily long and short portfolio counts for the main strategy and restricted variants."
short_description_chart = "Number of stocks in the long and short portfolios through time."
path_to_html_chart = "_output/portfolio_size_diagnostics_all.html"
